name: Verify receipt portfolio

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run static checks
        run: npm run check
      - name: Run full unit suite
        run: npm test -- --run
      - name: Run integration suite
        run: npm run test:integration
      - name: Verify stored evidence
        run: npm run evidence -- verify --all
      - name: Build static sites
        run: npm run build
