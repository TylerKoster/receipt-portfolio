name: Verify receipt portfolio

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run static checks
        run: npm run check
      - name: Check formatting
        run: >-
          npx prettier --check
          ".github/workflows/*.yml"
          "README.md"
          "docs/operations/*.md"
          "manifests/**/*.json"
          "packages/**/*.ts"
          "scripts/**/*.ts"
          "sites/**/*.{ts,css}"
          "test/**/*.ts"
      - name: Run full unit suite
        run: npm test -- --run
      - name: Run integration suite
        run: npm run test:integration
      - name: Collect deterministic controlled examples
        run: npm run evidence -- collect-fixtures
      - name: Verify exact nonempty evidence inventory
        run: npm run evidence -- verify --all
      - name: Run evidence mutation gate
        run: npm run evidence -- test-mutation
      - name: Build first clean static tree
        shell: bash
        run: |
          rm -rf dist/sites
          npm run build
          mkdir -p artifacts
          npm run build:manifest > artifacts/build-manifest-first.txt
      - name: Build second clean static tree
        shell: bash
        run: |
          rm -rf dist/sites
          npm run build
          npm run build:manifest > artifacts/build-manifest-second.txt
      - name: Compare deterministic build manifests
        shell: bash
        run: cmp artifacts/build-manifest-first.txt artifacts/build-manifest-second.txt
