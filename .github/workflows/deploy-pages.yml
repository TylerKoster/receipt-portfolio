name: Deploy receipt portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run static checks
        run: npm run check
      - name: Run full test suite
        run: npm test -- --run
      - name: Collect controlled and pinned-source evidence
        run: npm run evidence -- collect-fixtures
      - name: Verify exact nonempty evidence inventory
        run: npm run evidence -- verify --all
      - name: Run evidence mutation gate
        run: npm run evidence -- test-mutation
      - name: Build GitHub Pages static tree
        env:
          RECEIPT_PORTFOLIO_BASE_URL: https://tylerkoster.github.io/receipt-portfolio/
        run: npm run build
      - name: Gate exact public build manifest
        shell: bash
        run: |
          mkdir -p artifacts
          npm run build:manifest | tee artifacts/pages-build-manifest.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/sites

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
