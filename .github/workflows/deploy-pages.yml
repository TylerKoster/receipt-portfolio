name: Deploy receipt portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run static checks
        run: npm run check
      - name: Run full test suite
        run: npm test -- --run
      - name: Collect controlled and pinned-source evidence including AI Moment Index
        run: npm run evidence -- collect-fixtures
      - name: Run AI Moment Index focused fixture and build contract
        run: npm test -- --run test/integration/video-moment-search-build.test.ts
      - name: Verify exact nonempty evidence inventory
        run: npm run evidence -- verify --all
      - name: Run evidence mutation gate
        run: npm run evidence -- test-mutation
      - name: Build GitHub Pages static tree
        env:
          RECEIPT_PORTFOLIO_BASE_URL: https://tylerkoster.github.io/receipt-portfolio/
        run: npm run build
      - name: Gate exact public build manifest
        shell: bash
        run: |
          mkdir -p artifacts
          npm run build:manifest | tee artifacts/pages-build-manifest.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/sites

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  public-health:
    needs: deploy
    permissions: {}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Verify AI Moment Index public routes and timestamp documents
        shell: bash
        run: |
          home_document="$(mktemp)"
          video_document="$(mktemp)"
          moment_document="$(mktemp)"
          trap 'rm -f "$home_document" "$video_document" "$moment_document"' EXIT
          curl --fail --show-error --silent --location \
            'https://tylerkoster.github.io/receipt-portfolio/video-moment-search/' \
            > "$home_document"
          curl --fail --show-error --silent --location \
            'https://tylerkoster.github.io/receipt-portfolio/video-moment-search/videos/robots-under-control/' \
            > "$video_document"
          curl --fail --show-error --silent --location \
            'https://tylerkoster.github.io/receipt-portfolio/video-moment-search/moments/moment-robots-control/' \
            > "$moment_document"
          source_timestamp='https://upload.wikimedia.org/wikipedia/commons/transcoded/4/47/How_can_we_keep_robots_under_control.webm/How_can_we_keep_robots_under_control.webm.240p.vp9.webm#t=132'
          grep --fixed-strings -- "$source_timestamp" "$video_document"
          grep --fixed-strings -- "$source_timestamp" "$moment_document"
